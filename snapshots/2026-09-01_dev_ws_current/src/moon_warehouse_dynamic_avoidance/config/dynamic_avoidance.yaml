dynamic_obstacle_predictor_node:
  ros__parameters:
    use_sim_time: true
    prediction_horizon: 3.0
    prediction_dt: 0.1
    history_size: 20
    frame_id: map
    predictor_mode: lstm
    model_filename: dynamic_obstacle_lstm.ts
    normalization_filename: normalization.json
    inference_timeout_ms: 20.0
    enable_fallback: true
    observation_timeout: 0.5
    maximum_speed: 0.60
    teleport_reset_distance: 0.60
    teleport_reset_speed: 2.00
    history_gap_reset: 0.40
    route_attachment_tolerance: 0.35
    recent_velocity_window: 6
    minimum_route_speed: 0.12
    # Known simulator routes. When the team changes the map, only these arrays
    # need updating; unknown obstacle IDs still use constant velocity.
    route_ids: [moving_obstacle_1, moving_obstacle_2]
    # The second patrol is the observed vertical segment (5, -3) <-> (5, 0).
    # Keeping this prediction aligned with the SDF route prevents a late
    # collision response when it crosses the route to zone C.
    route_axes: ['x', 'y']
    route_mins: [-2.0, -3.0]
    route_maxs: [1.0, 0.0]
    route_fixed_coordinates: [2.8, 5.0]
dynamic_obstacle_trajectory_visualizer:
  ros__parameters:
    use_sim_time: true
    prediction_topic: /moon_warehouse/dynamic_obstacle_trajectories
    marker_topic: /moon_warehouse/dynamic_obstacle_markers
    risk_diameter: 1.80
departure_heading_lock:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    goal_change_distance: 0.25
    heading_lookahead: 0.65
    heading_lock_entry_angle: 0.60
    heading_kp: 2.0
    heading_max_angular_speed: 1.30
    heading_min_angular_speed: 0.30
    heading_exit_tolerance: 0.10
    heading_settle_time: 0.20
    tf_timeout: 0.05
dynamic_obstacle_scan_filter:
  ros__parameters:
    use_sim_time: true
    input_scan_topic: /scan
    output_scan_topic: /scan_costmap
    safety_scan_topic: /scan_safety
    prediction_topic: /moon_warehouse/dynamic_obstacle_trajectories
    prediction_timeout: 0.40
    filter_radius: 0.55
    # Dynamic objects are represented by the time-aware predictor/SIPP/MPPI
    # stack. Keeping their close laser returns in the timeless costmap turns
    # a yielding obstacle into a persistent wall; Collision Monitor still
    # receives the untouched /scan_safety feed for the hard safety stop.
    near_field_passthrough_range: 0.80
    tf_timeout: 0.03
    # Asymmetric base + forward arm footprint in the lidar/base frame.  These
    # limits remove only robot self echoes; external near-field geometry stays
    # visible on /scan_safety.
    self_footprint_x_min: -0.24
    self_footprint_x_max: 0.48
    self_footprint_y_half: 0.24
    self_footprint_margin: 0.01
sipp_decision_node:
  ros__parameters:
    use_sim_time: true
    shadow_mode: false
    # MPPI still evaluates dynamic collision risk at 20 Hz. Running the
    # higher-level SIPP reservation search at 6 Hz limits obstacle movement
    # between decisions to about 3 cm while freeing enough CPU for Gazebo GUI,
    # TF and the controller loop to stay real-time in the VM.
    decision_frequency: 6.0
    conflict_radius: 0.78
    # Centre-distance geometry: robot radius 0.22 m plus the 0.60 m square
    # obstacle's 0.424 m circumscribed radius is about 0.644 m.
    hard_release_radius: 0.65
    conflict_longitudinal_margin: 0.30
    time_margin: 0.35
    release_time_margin: 0.25
    half_vehicle_length: 0.20
    static_stop_margin: 0.70
    comfortable_deceleration: 2.50
    launch_acceleration: 2.00
    stop_reached_tolerance: 0.05
    minimum_prediction_speed: 0.30
    # 机器人实际被 velocity_smoother 封顶在 0.60m/s，冲突窗口计算必须按真实速度
    maximum_prediction_speed: 0.60
    endpoint_distance: 0.40
    data_timeout: 0.6
    global_frame: map
    robot_base_frame: base_footprint
    plan_timeout: 2.5
    tf_timeout: 0.05
    maximum_path_deviation: 0.75
    maximum_index_backtrack: 2
    maximum_occupancy_gap: 0.25
    same_goal_tolerance: 0.25
    route_change_threshold: 0.50
    route_change_confirm_cycles: 3
    conflict_confirm_cycles: 2
    conflict_release_time: 0.50
    conflict_match_radius: 0.45
    conflict_clear_margin: 0.35
    prepare_lead_time: 0.70
    departure_heading_lookahead: 0.40
    departure_yaw_tolerance: 0.08
    prepare_yaw_kp: 1.50
    prepare_max_angular_speed: 1.30
    prepare_min_angular_speed: 0.25
    prepare_settle_time: 0.20
    # Require a brief stable safe window before releasing a prepared pass.
    release_confirm_time: 0.45
    # These are upper gates, not unconditional commands.  SIPP selects the
    # cautious mode for an imminent conflict and Collision Monitor still owns
    # the final stop.  Open, aligned corridors may use the requested 1.2 m/s.
    fast_cruise_speed: 1.20
    normal_cruise_speed: 0.95
    cautious_speed: 0.45
    fast_cruise_horizon: 3.0
    fast_cruise_min_goal_distance: 0.60
    fast_cruise_max_heading_error: 0.25
    fast_cruise_max_curvature: 0.60
    mppi_feedback_timeout: 0.40
    mppi_pass_min_safe_ratio: 0.80
    pass_commit_timeout_margin: 2.00
    pass_entry_hysteresis: 0.05
    # PREPARE holds the executed command at zero. MPPI's safe preview commonly
    # starts at 0.15-0.25 m/s, then accelerates after release; 0.35 caused a
    # circular wait until Nav2 recovery. Keep a non-zero intent requirement.
    pass_release_min_nav_speed: 0.12
    pass_release_max_nav_angular_speed: 0.35
    # An imminent, close collision always revokes a committed pass/detour.
    pass_emergency_ttc: 0.50
    # Debounce ordinary timing/feasibility noise after a valid PASS. A hard
    # MPPI emergency recommendation still overrides immediately.
    pass_recheck_confirm_cycles: 2
    pass_stall_timeout: 1.00
    pass_stall_speed: 0.05
    pass_stall_angular_speed: 0.15
    blocked_redecision_hold: 0.80
    # Prefer a sampled MPPI bypass only when it is demonstrably safer and
    # faster than waiting. The speed matches the VM's true velocity cap.
    enable_local_detour: true
    detour_min_wait_time: 0.60
    detour_base_extra_time: 0.30
    detour_risk_time_weight: 0.60
    detour_safe_trajectory_ratio: 0.92
    detour_min_collision_ttc: 1.00
    detour_speed: 0.60
    detour_min_commit_time: 1.20
    detour_recheck_confirm_cycles: 2
    departure_turn_heading_error: 0.55
    departure_turn_path_distance: 0.30
sipp_velocity_gate:
  ros__parameters:
    use_sim_time: true
    decision_timeout: 0.5
    comfortable_deceleration: 2.50
    approach_angular_zero_distance: 0.30
    prepare_max_angular_speed: 1.30
