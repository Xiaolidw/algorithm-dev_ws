fixed_manipulation_server:
  ros__parameters:
    use_sim_time: true

    # ROS interfaces
    action_name: /manipulation/execute
    arm_action_name: /arm_controller/follow_joint_trajectory
    gripper_action_name: /gripper_controller/follow_joint_trajectory
    attach_service_name: /ATTACHLINK
    detach_service_name: /DETACHLINK
    get_state_service_name: /gazebo/get_entity_state
    dependency_timeout_s: 10.0

    # Gazebo model/link names
    robot_model: six_arm
    tool_link: link6
    default_object: red_cube_1
    object_link: link
    placement_zone_models: [zone_a, zone_b, zone_c]
    placement_zone_link: base
    # A/B/C markings are visual-only (no collision floor).  Bring the cube
    # centre to the real ground-contact height before opening the gripper;
    # this prevents a lightweight cube from gaining a lateral bounce on a
    # visible free fall.  Release remains a physical gripper release.
    placement_drop_height: 0.005
    # Five physical storage slots per scoring area.  The arm chooses the first
    # unoccupied reachable slot from Gazebo truth and solves its joint pose at
    # runtime, preventing consecutive cubes from overlapping at one point.
    # A and B are now approached from the north while facing south.  Keep
    # each row on the north half of its sign and bias the lateral fill order
    # around the measured arm centreline.  Offline FK/IK residuals for every
    # listed slot are <= 7.2 mm (acceptance limit: 12 mm).
    placement_slot_specs:
      # A receives two red cubes.  The former 6 cm row could mark the second
      # slot occupied after only 1 cm of physical landing error and force an
      # unreachable third slot.  Keep the proven second centre and move the
      # first 12 cm away.
      - 'zone_a:-0.18:0.12'
      - 'zone_a:-0.06:0.12'
      # B receives three blue cubes.  Keep 12 cm between nominal centres so
      # the measured release tolerance cannot collapse adjacent cubes below
      # the 5.5 cm physical-clearance gate.
      # B 底盘实际在 x≈-2.12、面向西的工作位接管。把三槽放在牌面
      # 中线 x=0，令竖直夹爪前向距离约 0.38m；无需再把底盘向木墙推进。
      - 'zone_b:0.00:-0.12'
      - 'zone_b:0.00:0.00'
      - 'zone_b:0.00:0.12'
      - 'zone_c:0.10:-0.20'
      - 'zone_c:0.10:-0.14'
      - 'zone_c:0.10:-0.08'
      - 'zone_c:0.10:-0.02'
      - 'zone_c:0.10:0.04'
    placement_objects:
      [red_cube_1, red_cube_2, red_cube_3, red_cube_4, red_cube_5,
       blue_cube_1, blue_cube_2, blue_cube_3, blue_cube_4, blue_cube_5]
    placement_zone_half_width: 0.50
    placement_zone_half_depth: 0.25
    # Includes the 15 mm cube half-width plus map/physics tolerance, so the
    # complete cube body—not merely its centre—must remain inside the paint.
    placement_boundary_margin: 0.025
    placement_slot_clearance: 0.055
    dynamic_place_ik: true
    dynamic_place_max_target_distance_m: 0.58
    # 真值验证表明 FK 放置末端比地面高约 0.10m；仅用于单次放下轨迹的
    # 模型标定，之后仍以 Gazebo 真值决定是否允许松爪。
    dynamic_place_vertical_target_bias_m: -0.10
    # 与抓取一样：先在槽位正上方到位，再单次竖直下降，避免斜向扫入
    # 地面或相邻物块。
    dynamic_place_pre_drop_height_m: 0.12

    # Controller joint order
    arm_joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    gripper_joints: [finger_joint1, finger_joint2]

    # Fixed phase-1 poses. Values come from the reference project's tested
    # trajectory/SRDF and must be tuned with the real competition geometry.
    arm_home: [0.0, 0.6102, 1.2593, 0.0, -1.4931, 0.0]
    # 以红1真实坐标、底盘最终可达停车位及URDF连杆模型重新反解：
    # 指尖中心位于物块正上方约12cm，home→此位姿的链路净空>2cm。
    arm_pregrasp: [0.00595, 0.51748, 1.68959, 0.00073, -0.78123, 0.0]
    # Offline FK solution for a cube 0.32m ahead of the base. The resulting
    # fingertip center is (0.3203, 0, -0.1497) in arm_base_link: <0.5mm error.
    # 对应同一真实坐标系的最终入夹位；方块中心为 link6+(0,0,0.045)。
    arm_pick: [0.00601, 1.11709, 1.39792, 0.00077, -0.43087, 0.0]
    arm_lift: [0.0, 0.6102, 1.2593, 0.0, -1.4931, 0.0]
    # q2+q3-q5=pi：夹爪接近轴保持竖直，避免斜着张爪把相邻方块弹飞。
    arm_place: [0.0, 1.2, 1.17, 0.0, -0.7716, 0.0]
    gripper_open: [0.0, 0.0]
    gripper_closed: [0.0125, 0.0125]

    # Calibration passes on the VM: 2.2 s per arm swing keeps the light
    # differential chassis stable while saving ~8 s per pick/place pair.
    arm_motion_duration_s: 2.2
    gripper_motion_duration_s: 0.6
    settle_time_s: 0.1

    # Ported from the supplied safe grasp script. The selected task object
    # must be physically inside link6's grasp window before Link Attacher is
    # allowed to create a joint, and it must remain rigid while lifting.
    validate_grasp_window: true
    # SafeAutoGrasper参考几何：方块中心必须位于link6 +Z 45mm的两指中心。
    grasp_target_x: 0.0
    grasp_target_y: 0.0
    grasp_target_z: 0.045
    # 闭爪前同时满足球形误差、横向走廊和指尖高度窗；否则重新对位。
    grasp_position_tolerance: 0.035
    grasp_xy_tolerance: 0.025
    grasp_z_min: 0.020
    grasp_z_max: 0.075
    # 物理步刚性跟随的稳态测量残差约 4.13mm；脱落时则为厘米级。
    # 5mm 保持严格校验，同时避免将正常的仿真积分误差误判为抓取失败。
    attached_drift_tolerance: 0.005

    # 底盘在目标物块前受碰撞监视器制动时，根据世界真值实时补偿末端
    # 位姿；最终仍须通过上方的 3.5cm/2.5cm 严格夹爪窗口验证。
    dynamic_grasp_ik: true
    dynamic_grasp_max_target_distance_m: 0.48
    arm_ik_reference_link: base_footprint
    arm_ik_reference_to_base_z: 0.1634

    # When true, validate the goal and publish Action feedback without
    # requiring controllers or Link Attacher. Use for Fake acceptance only.
    dry_run: false
