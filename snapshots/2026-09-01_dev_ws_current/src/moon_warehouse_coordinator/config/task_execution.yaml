# Closed-loop acceptance flow. Object entries are safe approach poses,
# not the physical cube centers. Manipulation runs after each navigation leg.
flow_execution:
  plan_timeout_sec: 150.0
  # bt_navigator 在高负载虚拟机上从 Configuring 到 ACTIVE 可超过 50s,
  # 期间目标会被整体拒绝; 运行前显式等待 ACTIVE, 并保留宽松重试兜底。
  nav2_active_wait_sec: 240.0
  # Front-end Gazebo/RViz rendering can make a valid aisle traversal slower
  # than headless execution.  Do not classify it as a navigation failure.
  navigation_timeout_sec: 480.0
  # Only a 0.20m improvement in Nav2's best distance-to-goal counts as real
  # progress. Raw chassis displacement is deliberately excluded because a
  # robot circling a conflict zone is moving but not completing the route.
  # The 90s window still permits a deliberate dynamic-obstacle detour.
  navigation_stall_timeout_sec: 45.0
  navigation_motion_progress_m: 0.15
  # Task 1 crosses obstacle 1's frozen y=3 rail.  Start only after the
  # obstacle has turned at the west endpoint and is moving east, so its
  # direction-latched yield cannot retreat into the robot's crossing path.
  # This is observation-driven and does not alter the obstacle itself.
  pickup_rail_gate_enabled: true
  pickup_rail_gate_release_x: -1.80
  pickup_rail_gate_min_east_velocity: 0.05
  pickup_rail_gate_observation_stale_sec: 2.0
  pickup_rail_gate_timeout_sec: 60.0
  manipulation_timeout_sec: 45.0
  # Five physical pick/place cycles exceed the old 295 s demo limit even
  # when every navigation leg succeeds. Keep per-leg timeouts strict while
  # allowing a complete official five-object plan to finish.
  max_flow_duration_sec: 3600.0
  # A transient controller reset must not end an official question early.
  max_navigation_retries: 5
  # A grasp-window or controller transient triggers a fresh precision
  # alignment instead of discarding the entire official five-task question.
  max_manipulation_retries: 2
  retry_delay_sec: 3.0
  # 预接近点只负责把底盘送入最终直线靠近走廊；允许差速底盘在朝向
  # 已对齐后留下少量横向停车残差。最终 PICKUP 与夹爪几何检查不放宽。
  # 预接近点位于静态墙体/货物膨胀层边界。实测红2等工位的完整
  # 机械臂足迹会稳定停在 26.6cm；在红2两侧未搬物块的膨胀区之间，
  # Nav2为了满足终点姿态会停在约42.1cm残差并反复恢复。45cm只用于
  # 取消不可实现的预靠近终点姿态，把控制权交给最大接管距离1.10m、
  # 且仍受碰撞监控的最终闭环靠泊；下方12cm物理取件门限及夹爪
  # 三维真值窗口保持不变，因此不会形成远距抓取。
  preapproach_acceptance_m: 0.45
  # Pickup transit is only a clear-aisle staging point.  At its surveyed
  # 15 cm radius the next pre-approach still owns all heading alignment and
  # the strict final-dock grasp gate, avoiding a false no-progress timeout
  # while Nav2 tries to refine a non-actionable terminal yaw.
  pickup_transit_acceptance_m: 0.15
  # 最终取件位不允许“接近即停”：静态关节抓取姿态只对毫米级底盘
  # 误差成立。这里的阈值既是取消 Nav2 的接力条件，也是抓取前的
  # 几何门槛；未进入该窗口则继续精确靠近/重试，绝不伸臂碰方块。
  # 目标方块本身被局部碰撞监视器保留制动距离。允许底盘在 12cm 安全
  # 边界内停下；随后动态 IK 将工具端精确送到两指中心，且抓取服务仍
  # 以 link6 相对位姿窗口作最终否决，绝不会远距吸附。
  pickup_acceptance_m: 0.12
  # 约 1.7 度。横向 1.5cm + 航向误差仍可保证方块位于两指之间，
  # 而不是落在单个夹爪外侧。
  pickup_yaw_tolerance_rad: 0.03
  # 放置区是面积目标，但机械臂仍在底盘坐标系中动作。底盘只有同时进入
  # 20cm 位置窗和约5.7°航向窗后才能张爪；Nav2 的宽松成功回执不能
  # 触发远距离释放。动态放置 IK 会继续消除这一区间内的剩余误差。
  dropoff_acceptance_m: 0.20
  # B 区北向终端位紧邻区域碰撞边界。差速底盘实测会稳定停在
  # 0.28~0.30 m 导航残差，但此时动态槽位 IK 仅 1.3 mm 残差且真实
  # 方块完整位于区域内。只对 B 区扩大“导航到机械臂”的接管门限；
  # A/C、动态 IK、区域边界真值检查和释放确认保持原精度。
  dropoff_acceptance_by_destination: {B: 0.32}
  dropoff_yaw_tolerance_rad: 0.10
  # B 区西侧是真实木墙，公共停车位不能再向西推。先让 Nav2/A* 到达
  # 墙外侧 0.50m 的东侧工位，取消其末端姿态细调后由低速闭环停车器
  # 沿已验证的直线走廊进入。该流程只供 B 区蓝块使用，A/C 不受影响。
  b_dropoff_preapproach_acceptance_m: 0.16
  b_dropoff_pre_settle_sec: 0.60
  b_dropoff_near_stop_m: 0.20
  b_dropoff_near_settle_sec: 0.50
  # B 的实际工作姿态是 (-2,-5) 附近、面向西。允许在 10cm 内接管，
  # 避免 Collision Monitor 已安全停车后反复回退重规划；随后仍执行
  # 最终零速保持和严格的末端槽位/物理释放校验。
  b_dropoff_final_acceptance_m: 0.10
  b_dropoff_final_settle_sec: 0.70
  b_dropoff_timeout_sec: 35.0
  b_dropoff_far_speed_mps: 0.10
  b_dropoff_near_speed_mps: 0.045
  b_dropoff_progress_timeout_sec: 4.0
  # 仅用于 /mission/run_b_dropoff_regression 的单段回归入口；它不会
  # 生成 A 区任务，仍走正式抓取、载物、停车、放置和 secure 验收链路。
  # 最近的 blue_cube_3（约 -2.88,1.70）抓取稳定，但其 B 预接近点在
  # 真实地图中不可达，不能把六次 Nav2 失败当作“快速回归”。放置链路
  # 暂以已验证可抵达 B 的 blue_cube_1 回归；blue_cube_3 路线另行修复。
  b_dropoff_regression_object: blue_cube_1
  # 最后一段不再交给会避开目标方块本身的全局规划器。先导航到沿夹取
  # 朝向后退 0.5m 的安全工位，再以低速直线闭环驶入最终停车点；这样
  # 既不会碾过待抓方块，也能确保到位精度。
  precision_dock_timeout_sec: 45.0
  precision_dock_max_speed_mps: 0.14
  # 放置插件会把方块固定在区域内。恢复其障碍代价前，底盘必须完全
  # 离开“0.48m前伸机械臂 + 0.15m方块 + 0.50m局部膨胀”的重叠区。
  # 旧0.48m阈值会在仅退出约0.10m时切换下一任务，使MPPI所有采样
  # 都从碰撞代价开始。这里用0.92m真值净距，并保留碰撞监控低速退出。
  post_place_departure_m: 0.65
  post_place_reverse_speed_mps: 0.12
  # Robot footprint radius (~0.22m) plus cube circumscribed radius (~0.07m)
  # is below 0.30m. At 0.42m centre clearance the objects are physically
  # separated, so let the next Nav2 leg choose a map-aware egress instead of
  # The placed cube is still visible in the raw lidar obstacle layer.  Do not
  # hand the next goal to Nav2 while the 0.48 m planning footprint overlaps
  # that return.  Reverse departure is filtered by Collision Monitor, so it
  # stops rather than backing into a wall; it also exits early once the same
  # 0.70 m clearance used by the cube virtual layer has been reached.
  post_place_min_cube_clearance_m: 0.70
  post_place_clearance_settle_sec: 0.60

  # 方块基准坐标（世界文件）: red y=3.9 / blue y=1.7,
  # x=-8.35/-6.15/-3.95/-1.75/0.45。
  # 旧停车距离0.46~0.48m迫使机械臂工作在伸展极限，方块只能悬在两指旁。
  # 新停车距离0.32m由机械臂FK可达性反算；对应指尖中心误差<0.5mm。
  # 每个接近点配一个同航向预接近点(后方0.75m): 最后一段直行对准驶入。
  # 差速底盘无法纯横移, 斜向接近时 MPPI 会在"朝向目标点"与"朝向最终航向"
  # 之间振荡(实测卡死118s触发3次恢复)。
  # 走廊均经过静态地图逐点校验:
  # - red_cube_1 西侧有凹室(x-11.5~-10.4), 东侧有隔墙(x~-7.0, y2.9~4.9),
  #   故从南侧走道(两排之间)向北接近;
  # - 隔墙在 y=1.7 不存在, blue_cube_1 与其余方块统一从东侧接近。
  object_approaches:
    # 红1在差速底盘+膨胀层下的实测可达稳定点为(-8.524,3.638)，
    # 距物块31.5cm；面向物块中心的航向为0.985rad。直接以此作为
    # 最终停车位，避免在终点要求不可实现的横移。
    # 经夹爪中心/物理携带复核的稳定工位：方块从西南侧进入两指中心，
    # 避开近轴奇异构型，同时保留与墙体及方块的安全距离。
    red_cube_1:  {x: -8.42, y: 3.62, yaw: 0.9850}
    red_cube_2:  {x: -5.83, y: 3.9, yaw: 3.1416}
    red_cube_3:  {x: -3.68, y: 3.9, yaw: 3.1416}
    red_cube_4:  {x: -1.43, y: 3.9, yaw: 3.1416}
    red_cube_5:  {x: 0.77, y: 3.9, yaw: 3.1416}
    blue_cube_1:  {x: -8.03, y: 1.7, yaw: 3.1416}
    blue_cube_2:  {x: -5.83, y: 1.7, yaw: 3.1416}
    blue_cube_3:  {x: -3.63, y: 1.7, yaw: 3.1416}
    blue_cube_4:  {x: -1.43, y: 1.7, yaw: 3.1416}
    blue_cube_5:  {x: 0.77, y: 1.7, yaw: 3.1416}

  object_preapproaches:
    # 西侧隔墙的膨胀层在 x≈-8.61 形成可达边界；该点是实测无接触、
    # 航向已对齐的预接近工位，后续由安全工位段绕入。
    red_cube_1:  {x: -8.47, y: 2.83, yaw: 1.5708}
    red_cube_2:  {x: -5.08, y: 3.9, yaw: 3.1416}
    red_cube_3:  {x: -2.88, y: 3.9, yaw: 3.1416}
    red_cube_4:  {x: -0.68, y: 3.9, yaw: 3.1416}
    red_cube_5:  {x: 1.52, y: 3.9, yaw: 3.1416}
    blue_cube_1:  {x: -7.28, y: 1.7, yaw: 3.1416}
    blue_cube_2:  {x: -5.08, y: 1.7, yaw: 3.1416}
    blue_cube_3:  {x: -2.88, y: 1.7, yaw: 3.1416}
    blue_cube_4:  {x: -0.68, y: 1.7, yaw: 3.1416}
    blue_cube_5:  {x: 1.52, y: 1.7, yaw: 3.1416}

  # 最终 0.5m 直线进给的起点。该段逐一避开墙体、固定石块和其余方块；
  # 动态障碍位于其它走廊，仍由前面的 Nav2+预测避障段处理。
  object_dock_stages:
    # 朝最终抓取点的直线航向 atan2(3.64-2.84, -8.52+8.61)。
    red_cube_1:  {x: -8.61, y: 2.84, yaw: 1.4588}
    red_cube_2:  {x: -5.33, y: 3.90, yaw: 3.1416}
    red_cube_3:  {x: -3.13, y: 3.90, yaw: 3.1416}
    red_cube_4:  {x: -0.93, y: 3.90, yaw: 3.1416}
    red_cube_5:  {x: 1.27, y: 3.90, yaw: 3.1416}
    blue_cube_1: {x: -7.53, y: 1.70, yaw: 3.1416}
    blue_cube_2: {x: -5.33, y: 1.70, yaw: 3.1416}
    blue_cube_3: {x: -3.13, y: 1.70, yaw: 3.1416}
    blue_cube_4: {x: -0.93, y: 1.70, yaw: 3.1416}
    blue_cube_5: {x: 1.27, y: 1.70, yaw: 3.1416}

  # Task 1 enters the upper circulation area directly.  Do not reintroduce a
  # lower-aisle transit here: its former endpoint was constrained by the real
  # y=0.90 wall and the blue-cube row, so it cannot serve as a safe bypass.
  pickup_transits:
    # Use the surveyed centre aisle between the blue (y=1.7) and red
    # (y=3.9) rows.  The former x=-9.40/y=1.10 endpoint sat in the left-wall
    # and blue_cube_1 inflation pinch, while y=4.70 was inside the real top
    # wall's inflated cost field.  This point stays west of obstacle 1's
    # frozen x=[-3,2], y=3 rail and lines up with the red_cube_2/3 gap.
    red_cube_2:
      - {x: -5.08, y: 2.70, yaw: 1.5708}
    # After blue_cube_1 is placed, the chassis starts in B's tight bay just
    # east of the real x=-3.3 wall corner.  Sending the distant blue_cube_2
    # goal directly pulls MPPI northwest into that corner.  First use the
    # surveyed open floor to the east; the ordinary transit proximity handoff
    # then climb to the proven centre aisle before heading west.  A direct
    # diagonal from the lower aisle repeatedly entered blue_cube_3's real
    # inflation field near (-4.18,1.26), leaving MPPI and every recovery with
    # no collision-free motion.  From y=2.70 the final descent at x=-5.08
    # stays midway between blue_cube_2 and blue_cube_3.
    blue_cube_2:
      - {x: -1.80, y: -4.40, yaw: 0.0}
      - {x: -5.08, y: 2.70, yaw: 3.1416}

  # 红1西侧路线已实跑通过。红2～红5运输时先沿截图所示斜线驶向
  # 方块列西南侧的自由中间点，再去A区，避免全局规划把载物底盘
  # 塞进 red/blue 同列方块与移动障碍轨道之间的局部死区。
  dropoff_transits:
    # Keep the endpoint north of moving_obstacle_1's y=2.8 patrol rail.
    # The following A-zone leg may cross the rail under SIPP control, but the
    # robot must not be asked to settle on the dynamic conflict corridor.
    red_cube_2: {x: -5.35, y: 3.90, yaw: 0.0}
    red_cube_3: {x: -5.35, y: 2.70, yaw: -1.5708}
    red_cube_4: {x: -5.35, y: 2.70, yaw: -1.5708}
    red_cube_5: {x: -5.35, y: 2.70, yaw: -1.5708}

  destinations:
    # 由 Gazebo /model_states 真值和夹爪相对底盘实测偏移反算停车位。
    # A/C 采用朝西放置，可在方块落到区域中心的同时远离相邻墙体；
    # A-zone centre is (-7.0,-3.0).  Approach from the north and face south:
    # this keeps the base 0.74 m clear of Wall_107 while retaining a reachable
    # 0.55 m forward / 0.06 m lateral placement target for the arm.
    A: {x: -7.06, y: -2.50, yaw: -1.5708}
    # B 区的末端停车基准在标线东侧约 (-2.0, -5.0)。底盘朝西时，
    # 机械臂自然伸入 zone_b 的西侧槽位；既不需要把底盘挤向 Wall_75
    # (x=-3.26216)，也不会让车体碾压实体障碍。实测在 (-2.227,-4.989)
    # 时，末端到首个 B 槽位仍需 0.374m 前伸，导致竖直下降只能完成
    # 0.792；向西 0.10m 将其收至约 0.274m，同时完整前伸包络至木墙
    # 仍有约 0.38m 净距。朝西接管后机械臂直接覆盖 B 区东侧可达槽位。
    B: {x: -2.30, y: -5.00, yaw: 3.1416}
    C: {x: 11.40, y: -2.44, yaw: 3.14159}

  # The first two scored B cubes make the shared west parking pose lethal in
  # the global costmap.  Keep those real obstacles and approach the final
  # cube from the surveyed free cell north-east of them instead.
  object_dropoffs:
    blue_cube_3: {x: -2.60, y: -4.60, yaw: 0.0}

  # 这些点位于最终 B 停车位东侧；末段保持朝西低速驶入并以同一航向
  # 放置，避免不必要的 180° 原地转向，也避免底盘后缘靠近木墙。
  b_dropoff_preapproaches:
    blue_cube_1: {x: -1.55, y: -5.00, yaw: 3.1416}
    blue_cube_2: {x: -1.55, y: -5.00, yaw: 3.1416}
    blue_cube_3: {x: -2.10, y: -4.60, yaw: 3.1416}
