fixed_manipulation_server:
  ros__parameters:
    use_sim_time: true

    # ROS interfaces
    action_name: /manipulation/execute
    arm_action_name: /arm_controller/follow_joint_trajectory
    gripper_action_name: /gripper_controller/follow_joint_trajectory
    attach_service_name: /ATTACHLINK
    detach_service_name: /DETACHLINK
    get_state_service_name: /gazebo/get_entity_state
    dependency_timeout_s: 10.0

    # Gazebo model/link names
    robot_model: six_arm
    tool_link: link6
    default_object: red_cube_1
    object_link: link

    # Controller joint order
    arm_joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    gripper_joints: [finger_joint1, finger_joint2]

    # Fixed phase-1 poses. Values come from the reference project's tested
    # trajectory/SRDF and must be tuned with the real competition geometry.
    arm_home: [0.0, 0.6102, 1.2593, 0.0, -1.4931, 0.0]
    # Temporary safe calibration pose: identical to the verified home pose.
    # Tune this incrementally only after pick_pose is collision-free.
    arm_pick: [0.0, 1.2, 1.17, 0.0, -0.3, 0.0]
    arm_lift: [0.0, 0.6102, 1.2593, 0.0, -1.4931, 0.0]
    arm_place: [0.0, 1.2, 1.17, 0.0, -0.3, 0.0]
    gripper_open: [0.0, 0.0]
    gripper_closed: [0.0125, 0.0125]

    # Slow first-pass calibration to reduce impact while validating arm_pick.
    arm_motion_duration_s: 3.0
    gripper_motion_duration_s: 0.6
    settle_time_s: 0.1

    # Ported from the supplied safe grasp script. The selected task object
    # must be physically inside link6's grasp window before Link Attacher is
    # allowed to create a joint, and it must remain rigid while lifting.
    validate_grasp_window: true
    grasp_target_z: 0.045
    grasp_xy_tolerance: 0.08
    grasp_z_min: 0.0
    grasp_z_max: 0.13
    attached_drift_tolerance: 0.01

    # When true, validate the goal and publish Action feedback without
    # requiring controllers or Link Attacher. Use for Fake acceptance only.
    dry_run: false
