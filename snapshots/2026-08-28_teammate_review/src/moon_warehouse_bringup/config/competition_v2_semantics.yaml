# Semantic layout for the competition arrangement derived from the immutable
# official competition_v2.world. Coordinates use the Gazebo world / ROS map frame.
world_id: competition_v2_scoring
world_file: competition_v2_scoring.world
base_world_file: competition_v2.world
map_file: competition_v2_map.yaml
map_frame: map

robot_start:
  pose: [0.0, 0.0, 0.0]
  calibrated: false

approach_policy:
  reference_offset_m: 0.80
  note: "Initial map-safe poses; calibrate final arm-facing yaw during manipulation tuning."

# All cargo positions are at least 4 m apart. z is recorded for world/layout
# consistency even though Nav2 consumes only the 2-D search pose.
cargo:
  red:
    - {id: red_cube_1, object_pose: [-8.35, 3.9, 0.015], search_pose: null}
    - {id: red_cube_2, object_pose: [-6.15, 3.9, 0.015], search_pose: null}
    - {id: red_cube_3, object_pose: [-3.95, 3.9, 0.015], search_pose: null}
    - {id: red_cube_4, object_pose: [-1.75, 3.9, 0.015], search_pose: null}
    - {id: red_cube_5, object_pose: [0.45, 3.9, 0.015], search_pose: null}
  blue:
    - {id: blue_cube_1, object_pose: [-8.35, 1.7, 0.015], search_pose: null}
    - {id: blue_cube_2, object_pose: [-6.15, 1.7, 0.015], search_pose: null}
    - {id: blue_cube_3, object_pose: [-3.95, 1.7, 0.015], search_pose: null}
    - {id: blue_cube_4, object_pose: [-1.75, 1.7, 0.015], search_pose: null}
    - {id: blue_cube_5, object_pose: [0.45, 1.7, 0.015], search_pose: null}

# The three regions are placed in wall-separated rooms.
placement_areas:
  A: {center: [-11.0, -7.0, 0.01], approach_pose: [-10.311, -6.421, -2.443]}
  B: {center: [0.0, -11.5, 0.01], approach_pose: [-0.450, -12.279, 1.047]}
  C: {center: [11.0, -10.0, 0.01], approach_pose: [10.263, -9.484, -0.611]}

dynamic_obstacles:
  moving_obstacle_1:
    start: [-2.0, 2.8]
    end: [1.0, 2.8]
    speed_mps: 0.25
    pose_topic: /moving_obstacle_1/current_pose
  moving_obstacle_2:
    start: [5.5, -6.0]
    end: [8.0, -6.0]
    speed_mps: 0.25
    pose_topic: /moving_obstacle_2/current_pose
