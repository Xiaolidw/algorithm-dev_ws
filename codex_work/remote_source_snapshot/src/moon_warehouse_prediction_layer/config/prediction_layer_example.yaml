# =============================================================================
# PredictionLayer 配置示例 —— 合并进你的 Nav2 参数文件
# (moon_warehouse_bringup/config/competition_v2_amcl_stable.yaml)
#
# 用法: 把 local_costmap / global_costmap 的 plugins 列表里加入
#       prediction_layer，并追加下面这段参数。机器人自身和静止物块会被
#       排除（静止物块由 obstacle_layer 负责）。
# =============================================================================

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "prediction_layer"]
      prediction_layer:
        plugin: "moon_warehouse_prediction_layer/PredictionLayer"
        enabled: true
        # SimpleMovePlugin 往复障碍物在 model_states 里的名字前缀
        model_name_prefixes: ["moving_obstacle", "obstacle", "barrier"]
        # 机器人自身模型名，会被排除不预测
        robot_model_name: "six_arm"
        # 外推时长: 与 MPPI 优化窗口 time_steps*dt 匹配(建议 1.5~2.5s)
        prediction_horizon_sec: 2.0
        # 障碍物外接半径(米)，需 >= 障碍物实际尺寸的一半
        obstacle_radius_m: 0.3
        # 低于该速度视为静止，交给 obstacle_layer
        min_velocity_mps: 0.05
        # 254 = LETHAL_OBSTACLE; 若想留缓冲可降到 200~250
        predicted_cost: 254
        # 重绘节流，避免每个 costmap 周期都重算
        update_interval_sec: 0.2
        # 预测层也参与膨胀，让 MPPI 更早转向
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "inflation_layer", "prediction_layer"]
      prediction_layer:
        plugin: "moon_warehouse_prediction_layer/PredictionLayer"
        enabled: true
        model_name_prefixes: ["moving_obstacle", "obstacle", "barrier"]
        robot_model_name: "six_arm"
        prediction_horizon_sec: 2.0
        obstacle_radius_m: 0.3
        min_velocity_mps: 0.05
        predicted_cost: 254
        update_interval_sec: 0.2
