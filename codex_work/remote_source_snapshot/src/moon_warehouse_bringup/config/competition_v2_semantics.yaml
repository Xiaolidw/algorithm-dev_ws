# Semantic layout paired only with competition_v2.world and competition_v2_map.yaml.
# Coordinates use the Gazebo world / ROS map frame.  Do not reuse v1 poses here.
world_id: competition_v2
world_file: competition_v2.world
map_file: competition_v2_map.yaml
map_frame: map

robot_start:
  pose: [0.0, 0.0, 0.0]
  calibrated: false

approach_policy:
  reference_offset_m: 0.80
  reference_axis: negative_x
  note: "Generated test approaches only. Save a verified search_pose/approach_pose before automated missions."

cargo:
  red:
    - {id: red_cube_1, object_pose: [-1.5, 1.0, 0.0], search_pose: null}
    - {id: red_cube_2, object_pose: [-1.6, 1.0, 0.0], search_pose: null}
    - {id: red_cube_3, object_pose: [-1.7, 1.0, 0.0], search_pose: null}
    - {id: red_cube_4, object_pose: [-1.8, 1.0, 0.0], search_pose: null}
    - {id: red_cube_5, object_pose: [-1.9, 1.0, 0.0], search_pose: null}
  blue:
    - {id: blue_cube_1, object_pose: [-1.5, -1.0, 0.0], search_pose: null}
    - {id: blue_cube_2, object_pose: [-1.6, -1.0, 0.0], search_pose: null}
    - {id: blue_cube_3, object_pose: [-1.7, -1.0, 0.0], search_pose: null}
    - {id: blue_cube_4, object_pose: [-1.8, -1.0, 0.0], search_pose: null}
    - {id: blue_cube_5, object_pose: [-1.9, -1.0, 0.0], search_pose: null}

placement_areas:
  A: {center: [5.0, -11.0, 0.0], approach_pose: null}
  B: {center: [5.0, -12.0, 0.0], approach_pose: null}
  C: {center: [5.0, -13.0, 0.0], approach_pose: null}

dynamic_obstacles: {}
