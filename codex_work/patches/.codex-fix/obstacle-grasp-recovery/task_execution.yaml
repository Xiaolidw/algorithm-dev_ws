# Closed-loop acceptance flow. Object entries are safe approach poses,
# not the physical cube centers. Manipulation runs after each navigation leg.
flow_execution:
  plan_timeout_sec: 150.0
  # bt_navigator 在高负载虚拟机上从 Configuring 到 ACTIVE 可超过 50s,
  # 期间目标会被整体拒绝; 运行前显式等待 ACTIVE, 并保留宽松重试兜底。
  nav2_active_wait_sec: 240.0
  # Front-end Gazebo/RViz rendering can make a valid aisle traversal slower
  # than headless execution.  Do not classify it as a navigation failure.
  navigation_timeout_sec: 480.0
  manipulation_timeout_sec: 45.0
  # Five physical pick/place cycles exceed the old 295 s demo limit even
  # when every navigation leg succeeds. Keep per-leg timeouts strict while
  # allowing a complete official five-object plan to finish.
  max_flow_duration_sec: 3600.0
  # A transient controller reset must not end an official question early.
  max_navigation_retries: 5
  retry_delay_sec: 3.0

  # 方块基准坐标（世界文件）: red y=3.9 / blue y=1.7, x=-8.35/-6.15/-3.95/-1.75/0.45
  # 2026-08-28 实机标定: pick位姿下 link6 前伸0.353m+指尖0.08m≈0.433m。
  # 站位0.58m时工具系实测 x=-0.217/z=0.178, 距离过远导致抓取窗口判负且视觉悬浮。
  # 站位回退0.58m: 0.485m 实测闭爪/焊接/抬臂阶段方块相对位姿漂移0.79m(抬臂挥扫
  # 时焊死方块贴地拖拽引发物理瞬态), 0.58m 为历史验证稳定站位; 抓取窗口
  # z<=0.21 / |xy|<=0.25 已覆盖 0.58m 的名义读数 x=-0.217/z=0.178。
  # 每个接近点配一个同航向预接近点(后方0.9m): 最后一段直行对准驶入。
  # 差速底盘无法纯横移, 斜向接近时 MPPI 会在"朝向目标点"与"朝向最终航向"
  # 之间振荡(实测卡死118s触发3次恢复)。
  # 走廊均经过静态地图逐点校验:
  # - red_cube_1 西侧有凹室(x-11.5~-10.4), 东侧有隔墙(x~-7.0, y2.9~4.9),
  #   故从南侧走道(两排之间)向北接近;
  # - 隔墙在 y=1.7 不存在, blue_cube_1 与其余方块统一从东侧接近。
  object_approaches:
    red_cube_1:  {x: -8.35, y: 3.44, yaw: 1.5708}
    red_cube_2:  {x: -5.69, y: 3.9, yaw: 3.1416}
    red_cube_3:  {x: -3.49, y: 3.9, yaw: 3.1416}
    red_cube_4:  {x: -1.29, y: 3.9, yaw: 3.1416}
    red_cube_5:  {x: 0.91, y: 3.9, yaw: 3.1416}
    blue_cube_1:  {x: -7.89, y: 1.7, yaw: 3.1416}
    blue_cube_2:  {x: -5.69, y: 1.7, yaw: 3.1416}
    blue_cube_3:  {x: -3.49, y: 1.7, yaw: 3.1416}
    blue_cube_4:  {x: -1.29, y: 1.7, yaw: 3.1416}
    blue_cube_5:  {x: 0.91, y: 1.7, yaw: 3.1416}

  object_preapproaches:
    red_cube_1:  {x: -8.35, y: 2.54, yaw: 1.5708}
    red_cube_2:  {x: -4.79, y: 3.9, yaw: 3.1416}
    red_cube_3:  {x: -2.59, y: 3.9, yaw: 3.1416}
    red_cube_4:  {x: -0.39, y: 3.9, yaw: 3.1416}
    red_cube_5:  {x: 1.81, y: 3.9, yaw: 3.1416}
    blue_cube_1:  {x: -6.99, y: 1.7, yaw: 3.1416}
    blue_cube_2:  {x: -4.79, y: 1.7, yaw: 3.1416}
    blue_cube_3:  {x: -2.59, y: 1.7, yaw: 3.1416}
    blue_cube_4:  {x: -0.39, y: 1.7, yaw: 3.1416}
    blue_cube_5:  {x: 1.81, y: 1.7, yaw: 3.1416}

  destinations:
    # 2026-08-28 场景提效: 三个放置区整体迁移到紧邻货物区的中间隔间,
    # 仍两两隔墙(A-B墙x≈-7.4, A-C墙x≈-3.3, B-C墙x≈2.6), 离墙0.95m以上。
    # 单轮5任务总行程由约175m降至约88m。
    # 站位在 zone 中心南方 0.6m: 机械臂前伸 0.353m 把方块释放进 zone 南缘;
    # 若直接站在中心, 锚定会把方块传送到脚下, 虚拟方块层将机器人原地变成
    # 致命障碍, 全局规划器无法起步(实测任务2六连败根因)。
    # 站位需离最近墙体 ≥0.5m(robot_radius0.40+墙半厚0.075), 且距 zone 中心
    # ≤2m(锚定限制)。A 原(-11,-6.4)距斜墙Wall_129仅0.41m, MPPI无法进入致死区。
    A: {x: -13.2, y: -6.95, yaw: -1.5708}
    B: {x: -1.0, y: -3.1, yaw: 1.5708}
    C: {x: 11.0, y: -1.6, yaw: -1.5708}
