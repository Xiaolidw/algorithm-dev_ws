# Closed-loop acceptance flow. Object entries are safe approach poses,
# not the physical cube centers. Manipulation runs after each navigation leg.
flow_execution:
  plan_timeout_sec: 150.0
  # bt_navigator 在高负载虚拟机上从 Configuring 到 ACTIVE 可超过 50s,
  # 期间目标会被整体拒绝; 运行前显式等待 ACTIVE, 并保留宽松重试兜底。
  nav2_active_wait_sec: 240.0
  # Front-end Gazebo/RViz rendering can make a valid aisle traversal slower
  # than headless execution.  Do not classify it as a navigation failure.
  navigation_timeout_sec: 480.0
  manipulation_timeout_sec: 45.0
  # Five physical pick/place cycles exceed the old 295 s demo limit even
  # when every navigation leg succeeds. Keep per-leg timeouts strict while
  # allowing a complete official five-object plan to finish.
  max_flow_duration_sec: 3600.0
  # A transient controller reset must not end an official question early.
  max_navigation_retries: 5
  # A grasp-window or controller transient triggers a fresh precision
  # alignment instead of discarding the entire official five-task question.
  max_manipulation_retries: 2
  retry_delay_sec: 3.0
  # 预接近点只负责把底盘送入最终直线靠近走廊；允许差速底盘在朝向
  # 已对齐后留下少量横向停车残差。最终 PICKUP 与夹爪几何检查不放宽。
  # 预接近点位于静态墙体膨胀层边界：20cm 仍保留安全余量，避免
  # Nav2 为追求不可达终点贴墙；从此处开始使用地图校验过的直线进给。
  preapproach_acceptance_m: 0.20
  # 最终取件位不允许“接近即停”：静态关节抓取姿态只对毫米级底盘
  # 误差成立。这里的阈值既是取消 Nav2 的接力条件，也是抓取前的
  # 几何门槛；未进入该窗口则继续精确靠近/重试，绝不伸臂碰方块。
  # 目标方块本身被局部碰撞监视器保留制动距离。允许底盘在 12cm 安全
  # 边界内停下；随后动态 IK 将工具端精确送到两指中心，且抓取服务仍
  # 以 link6 相对位姿窗口作最终否决，绝不会远距吸附。
  pickup_acceptance_m: 0.12
  # 约 1.7 度。横向 1.5cm + 航向误差仍可保证方块位于两指之间，
  # 而不是落在单个夹爪外侧。
  pickup_yaw_tolerance_rad: 0.03
  # 最后一段不再交给会避开目标方块本身的全局规划器。先导航到沿夹取
  # 朝向后退 0.5m 的安全工位，再以低速直线闭环驶入最终停车点；这样
  # 既不会碾过待抓方块，也能确保到位精度。
  precision_dock_timeout_sec: 30.0
  precision_dock_max_speed_mps: 0.14

  # 方块基准坐标（世界文件）: red y=3.9 / blue y=1.7,
  # x=-8.35/-6.15/-3.95/-1.75/0.45。
  # 旧停车距离0.46~0.48m迫使机械臂工作在伸展极限，方块只能悬在两指旁。
  # 新停车距离0.32m由机械臂FK可达性反算；对应指尖中心误差<0.5mm。
  # 每个接近点配一个同航向预接近点(后方0.75m): 最后一段直行对准驶入。
  # 差速底盘无法纯横移, 斜向接近时 MPPI 会在"朝向目标点"与"朝向最终航向"
  # 之间振荡(实测卡死118s触发3次恢复)。
  # 走廊均经过静态地图逐点校验:
  # - red_cube_1 西侧有凹室(x-11.5~-10.4), 东侧有隔墙(x~-7.0, y2.9~4.9),
  #   故从南侧走道(两排之间)向北接近;
  # - 隔墙在 y=1.7 不存在, blue_cube_1 与其余方块统一从东侧接近。
  object_approaches:
    # 红1在差速底盘+膨胀层下的实测可达稳定点为(-8.524,3.638)，
    # 距物块31.5cm；面向物块中心的航向为0.985rad。直接以此作为
    # 最终停车位，避免在终点要求不可实现的横移。
    # 经夹爪中心/物理携带复核的稳定工位：方块从西南侧进入两指中心，
    # 避开近轴奇异构型，同时保留与墙体及方块的安全距离。
    red_cube_1:  {x: -8.42, y: 3.62, yaw: 0.9850}
    red_cube_2:  {x: -5.83, y: 3.9, yaw: 3.1416}
    red_cube_3:  {x: -3.63, y: 3.9, yaw: 3.1416}
    red_cube_4:  {x: -1.43, y: 3.9, yaw: 3.1416}
    red_cube_5:  {x: 0.77, y: 3.9, yaw: 3.1416}
    blue_cube_1:  {x: -8.03, y: 1.7, yaw: 3.1416}
    blue_cube_2:  {x: -5.83, y: 1.7, yaw: 3.1416}
    blue_cube_3:  {x: -3.63, y: 1.7, yaw: 3.1416}
    blue_cube_4:  {x: -1.43, y: 1.7, yaw: 3.1416}
    blue_cube_5:  {x: 0.77, y: 1.7, yaw: 3.1416}

  object_preapproaches:
    # 西侧隔墙的膨胀层在 x≈-8.61 形成可达边界；该点是实测无接触、
    # 航向已对齐的预接近工位，后续由安全工位段绕入。
    red_cube_1:  {x: -8.47, y: 2.83, yaw: 1.5708}
    red_cube_2:  {x: -5.08, y: 3.9, yaw: 3.1416}
    red_cube_3:  {x: -2.88, y: 3.9, yaw: 3.1416}
    red_cube_4:  {x: -0.68, y: 3.9, yaw: 3.1416}
    red_cube_5:  {x: 1.52, y: 3.9, yaw: 3.1416}
    blue_cube_1:  {x: -7.28, y: 1.7, yaw: 3.1416}
    blue_cube_2:  {x: -5.08, y: 1.7, yaw: 3.1416}
    blue_cube_3:  {x: -2.88, y: 1.7, yaw: 3.1416}
    blue_cube_4:  {x: -0.68, y: 1.7, yaw: 3.1416}
    blue_cube_5:  {x: 1.52, y: 1.7, yaw: 3.1416}

  # 最终 0.5m 直线进给的起点。该段逐一避开墙体、固定石块和其余方块；
  # 动态障碍位于其它走廊，仍由前面的 Nav2+预测避障段处理。
  object_dock_stages:
    # 朝最终抓取点的直线航向 atan2(3.64-2.84, -8.52+8.61)。
    red_cube_1:  {x: -8.61, y: 2.84, yaw: 1.4588}
    red_cube_2:  {x: -5.33, y: 3.90, yaw: 3.1416}
    red_cube_3:  {x: -3.13, y: 3.90, yaw: 3.1416}
    red_cube_4:  {x: -0.93, y: 3.90, yaw: 3.1416}
    red_cube_5:  {x: 1.27, y: 3.90, yaw: 3.1416}
    blue_cube_1: {x: -7.53, y: 1.70, yaw: 3.1416}
    blue_cube_2: {x: -5.33, y: 1.70, yaw: 3.1416}
    blue_cube_3: {x: -3.13, y: 1.70, yaw: 3.1416}
    blue_cube_4: {x: -0.93, y: 1.70, yaw: 3.1416}
    blue_cube_5: {x: 1.27, y: 1.70, yaw: 3.1416}

  destinations:
    # 由 Gazebo /model_states 真值和夹爪相对底盘实测偏移反算停车位。
    # A/C 采用朝西放置，可在方块落到区域中心的同时远离相邻墙体；
    # B 保持朝北，三处都给底盘外形和局部规划膨胀层留出安全余量。
    A: {x: -10.60, y: -5.74, yaw: 3.14159}
    B: {x: -1.0, y: -3.00, yaw: 1.5708}
    C: {x: 11.40, y: -2.44, yaw: 3.14159}
