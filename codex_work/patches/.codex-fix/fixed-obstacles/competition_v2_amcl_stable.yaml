amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    # Ignore a minority of scan beams inconsistent with the static map; this
    # prevents moving obstacles from pulling localization toward a false pose.
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 90
    max_particles: 3000
    min_particles: 800
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    # Simulation uses an identity map->odom transform because the robot always
    # spawns at the known map origin. Repetitive warehouse corridors and moving
    # objects can otherwise make AMCL jump to a visually similar aisle.
    tf_broadcast: false
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.65
    z_max: 0.05
    z_rand: 0.3
    z_short: 0.05
    scan_topic: scan
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # VMware scheduling jitter can exceed the upstream 20 ms action timeout.
    # A 20 Hz tree and a 0.5 s server handshake keep recovery branches from
    # aborting valid goals merely because MPPI/LSTM briefly occupy the CPU.
    bt_loop_duration: 50
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
controller_server:
  ros__parameters:
    use_sim_time: true
    # MPPI model_dt=0.05 requires a controller period no greater than 0.05 s.
    # Keep 20 Hz and reduce sampling/marker load below instead.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    # Progress checker parameters
    progress_checker:
      # Allow normal endpoint turns, but still recover if MPPI keeps rotating
      # without producing useful translational progress.
      plugin: "nav2_controller::SimpleProgressChecker"
      # Precision pick/place must still count centimetre-scale endpoint
      # convergence as progress; the old 0.15m test caused false recoveries.
      required_movement_radius: 0.05
      # SIPP may intentionally hold at a stop line for one obstacle cycle.
      # Do not treat that planned wait as controller failure/recovery.
      movement_time_allowance: 30.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller/SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 取件末段由固定的物理夹爪姿态完成；0.05m 会让底盘在横向
      # 偏差约 4cm 时就宣告到达，导致下探时从侧面碰方块。使用 1.5cm
      # / 1.7 度的工位级容差；普通长距离段的速度参数保持不变。
      xy_goal_tolerance: 0.015
      yaw_goal_tolerance: 0.03
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      forward_sampling_distance: 0.65
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.15
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      # 800 x 40 still covers a 2 s prediction horizon, while avoiding the
      # sustained 20 Hz deadline misses seen with the former 1500 x 56 set.
      time_steps: 40
      model_dt: 0.05
      batch_size: 800
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.25
      vy_std: 0.2
      wz_std: 0.25
      # 直线空旷段允许 0.60 m/s；SIPP 会在弯道、障碍物附近和冲突区
      # 自动下调速度，载物阶段还会由流程执行器额外封顶为 0.45 m/s。
      vx_max: 0.60
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      # Candidate-trajectory markers are expensive and are not part of the
      # scoring UI; the selected global/local paths remain visible in RViz.
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "LSTMDynamicObstacleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      LSTMDynamicObstacleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        obstacle_prediction_topic: /moon_warehouse/dynamic_obstacle_trajectories
        # Centre-distance envelopes include the 0.6m patrol object and the
        # arm-carry footprint.  The former values allowed edge contact and a
        # mutual-wait deadlock directly on the patrol line.
        safety_radius: 1.0
        danger_radius: 0.90
        collision_cost: 100000.0
        data_timeout: 0.5
        # At 1.4 m/s, 0.20 s sampling can skip a narrow geometric contact.
        # Check every 0.10 s while retaining the hard collision radius.
        trajectory_point_step: 2
        # Keep the t_exit implementation available, but disable its soft term
        # until it is calibrated: before the risk tube, a positive t_exit cost
        # can make stopping cheaper than entering an otherwise safe window.
        exit_time_weight: 0.0
        risk_tube_radius: 0.95
        cruise_soft_cost_scale: 0.35
        # PASS commits the timing decision, but must not disable steering away
        # from a physically occupied portion of the local trajectory.
        # SIPP owns PASS/WAIT. During a committed temporal window MPPI keeps
        # only a small continuous preference plus its unchanged hard collision
        # veto; a large soft term caused 0.8 m lateral detours and recoveries.
        pass_soft_cost_scale: 0.05
        # MPPI reports feasibility to SIPP. These thresholds do not select
        # WAIT/DETOUR inside the critic; they only classify sampled trajectories.
        feedback_publish_period: 0.10
        blocked_safe_ratio: 0.20
        infeasible_safe_ratio: 0.05
        emergency_distance: 0.85
        emergency_ttc: 0.45
      CostCritic:
        enabled: true
        cost_power: 1
        # The local costmap remains the instantaneous collision boundary.
        # Long-horizon yielding belongs to LSTM/SIPP, so do not let inflated
        # non-lethal cells behave like a second WAIT decision layer.
        cost_weight: 1.0
        critical_cost: 300.0
        # 使用完整非对称足迹，覆盖 0.32 m 底盘、前伸机械臂和载运物块。
        # 仅用 0.22 m 圆半径会出现“代价地图可过、实体机械臂撞墙”。
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 12
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.5
      # Nav2 StaticLayer reads this as a costmap-level parameter.  Both the
      # cargo overlay and scan layers must only add costs, never clear walls.
      use_maximum: true
      # x 正方向为车头。前缘覆盖机械臂/载物，后缘覆盖底盘和脚轮。
      footprint: "[[-0.24, -0.24], [-0.24, 0.24], [0.48, 0.24], [0.48, -0.24]]"
      plugins: ["static_layer", "cube_layer", "voxel_layer", "inflation_layer"]
      # 已知墙体、固定石块等实体直接进入局部规划。即使激光丢帧或
      # 动态障碍过滤短时失准，静态实体也不会从局部代价地图消失。
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        use_maximum: true
      # 货物方块低于雷达扫描面, 以已知世界坐标注入的虚拟障碍层防碾压
      cube_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /cube_obstacle_map
        map_subscribe_transient_local: true
        # The cube map is intentionally empty except for small cargo cells.
        # Combine by maximum so those free cells can never erase lidar walls.
        use_maximum: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Compact, steep local inflation: preserve collision clearance while
        # allowing a committed SIPP pass once the moving object has cleared.
        cost_scaling_factor: 6.0
        inflation_radius: 0.50
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        # Nav2's voxel layer supports at most 16 cells on Humble.  Keeping
        # the setting within that limit prevents the local costmap from
        # silently failing while a goal is active.
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          # Dynamic LSTM-tracked returns are removed only from this costmap
          # stream. Collision Monitor still consumes the original /scan.
          topic: /scan_costmap
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Gazebo reports clear beams as +Inf. Treat them as valid clearing
          # rays, otherwise cells marked by a moved obstacle can remain as a
          # local-costmap ghost indefinitely.
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          observation_persistence: 0.0
      always_send_full_costmap: True
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[-0.24, -0.24], [-0.24, 0.24], [0.48, 0.24], [0.48, -0.24]]"
      resolution: 0.05
      # The full-size cargo map contains free cells everywhere except cubes;
      # maximum composition prevents it from erasing the truth static map.
      use_maximum: true
      track_unknown_space: true
      plugins: ["static_layer", "cube_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # 货物方块虚拟层: 全局路径直接绕开物块
      cube_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /cube_obstacle_map
        map_subscribe_transient_local: True
        # Preserve the world-truth static map and only add cargo obstacles.
        use_maximum: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True
# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    yaml_filename: ""
    use_sim_time: true
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # 灰色未知栅格对应场内固定石块/实体标记。允许穿越会让全局路径
      # 直接穿过 1x1 m 石块，局部控制器只能原地拒绝执行。
      allow_unknown: false
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Contact is a last-resort condition.  These bounds keep a controller or
    # simulator hiccup from producing enough impulse to eject the base.
    max_velocity: [0.60, 0.0, 1.0]
    min_velocity: [-0.30, 0.0, -1.0]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-2.0, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    # Preserve low-speed convergence and final-yaw commands from MPPI.
    deadband_velocity: [0.005, 0.0, 0.01]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 3
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      # 雷达会扫到本车机械臂(0.15~0.35m自回波), 原始/scan会让approach层
      # 永远判定前方碰撞而把cmd_vel清零。消费已屏蔽自回波的/scan_costmap。
      topic: "/scan_costmap"
      min_height: 0.15
      max_height: 2.0
      enabled: True
docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking/SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
