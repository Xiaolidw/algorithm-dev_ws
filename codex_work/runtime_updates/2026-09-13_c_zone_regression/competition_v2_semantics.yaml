# Semantic layout for the competition arrangement derived from the immutable
# official competition_v2.world. Coordinates use the Gazebo world / ROS map frame.
world_id: competition_v2_scoring
world_file: competition_v2_scoring.world
base_world_file: competition_v2.world
map_file: competition_v2_map.yaml
map_frame: map

robot_start:
  pose: [0.0, 0.0, 0.0]
  calibrated: false

approach_policy:
  reference_offset_m: 0.80
  note: "Initial map-safe poses; calibrate final arm-facing yaw during manipulation tuning."

# map2 cargo layout. z is recorded for world/layout consistency even though
# Nav2 consumes live 2-D Gazebo poses.
cargo:
  red:
    - {id: red_cube_1, object_pose: [1.0, 4.0, 0.015], search_pose: null}
    - {id: red_cube_2, object_pose: [3.5, 0.5, 0.015], search_pose: null}
    - {id: red_cube_3, object_pose: [-1.7, 1.6, 0.015], search_pose: null}
    - {id: red_cube_4, object_pose: [-6.0, 0.0, 0.015], search_pose: null}
    - {id: red_cube_5, object_pose: [1.0, -9.0, 0.015], search_pose: null}
  blue:
    - {id: blue_cube_1, object_pose: [-2.0, 4.0, 0.015], search_pose: null}
    - {id: blue_cube_2, object_pose: [0.5, 1.6, 0.015], search_pose: null}
    - {id: blue_cube_3, object_pose: [-8.0, 0.0, 0.015], search_pose: null}
    - {id: blue_cube_4, object_pose: [-6.0, -7.0, 0.015], search_pose: null}
    - {id: blue_cube_5, object_pose: [-1.0, -9.0, 0.015], search_pose: null}

# The three regions are placed in wall-separated rooms.
placement_areas:
  A: {center: [-7.0, -3.8, 0.01], approach_pose: [-6.311, -3.221, -2.443]}
  B: {center: [-2.5, -5.0, 0.01], approach_pose: [-2.950, -5.779, 1.047]}
  C: {center: [7.0, -6.0, 0.01], approach_pose: [7.0, -5.5, -1.571]}

dynamic_obstacles:
  moving_obstacle_1:
    start: [-2.0, 2.8]
    end: [1.0, 2.8]
    speed_mps: 0.25
    pose_topic: /moving_obstacle_1/current_pose
  moving_obstacle_2:
    start: [1.0, -2.0]
    end: [1.0, -6.0]
    speed_mps: 0.50
    pose_topic: /moving_obstacle_2/current_pose
