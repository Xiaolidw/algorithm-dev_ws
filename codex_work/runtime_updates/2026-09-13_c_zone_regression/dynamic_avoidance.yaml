dynamic_obstacle_predictor_node:
  ros__parameters:
    use_sim_time: true
    prediction_horizon: 3.0
    prediction_dt: 0.1
    # V3 theta checkpoint metadata is authoritative (currently obs_len=16).
    history_size: 16
    frame_id: map
    # The current theta checkpoint repeatedly predicts route axes/bounds that
    # contradict this world's known obstacle tracks, then falls back anyway.
    # Skip that invalid 55 ms CPU inference and use the exact deterministic
    # reflection model until a compatible checkpoint is trained.
    predictor_mode: route_reflection
    model_filename: theta_lstm.pth
    # Empty resolves to the installed package's models/model_filename path.
    model_path: ""
    debug_theta: false
    inference_timeout_ms: 20.0
    enable_fallback: true
    observation_timeout: 0.5
    maximum_speed: 0.8
    teleport_reset_distance: 0.60
    teleport_reset_speed: 2.00
    history_gap_reset: 0.40
    route_attachment_tolerance: 0.35
    # Known simulator routes. When the team changes the map, only these arrays
    # need updating; unknown obstacle IDs still use constant velocity.
    route_ids: [moving_obstacle_1, moving_obstacle_2]
    # Quote YAML 1.1 boolean-like scalars: an unquoted `y` is parsed as true
    # by rcl and makes every node sharing this parameter file fail at startup.
    route_axes: ['x', 'y']
    route_mins: [-2.0, -6.0]
    route_maxs: [1.0, -3.0]
    route_fixed_coordinates: [2.8, 2.0]
departure_heading_lock:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    goal_change_distance: 0.25
    heading_lookahead: 0.65
    # RPP now owns the rotate-to-path transition.  Keep this relay in the
    # command chain for diagnostics, but make its legacy heading lock a
    # no-op so two independent controllers cannot fight over initial yaw.
    heading_lock_entry_angle: 3.20
    heading_kp: 2.0
    heading_max_angular_speed: 1.30
    heading_min_angular_speed: 0.30
    heading_exit_tolerance: 0.10
    heading_settle_time: 0.20
    tf_timeout: 0.05
dynamic_obstacle_scan_filter:
  ros__parameters:
    use_sim_time: true
    input_scan_topic: /scan
    output_scan_topic: /scan_costmap
    prediction_topic: /moon_warehouse/dynamic_obstacle_trajectories
    prediction_timeout: 0.40
    filter_radius: 0.55
    # A freshly tracked dynamic object is represented by LSTM/SIPP and the
    # MPPI dynamic critic. Do not also write it into the timeless local
    # costmap, otherwise its swept scan marks become a persistent wall.
    # Collision Monitor still consumes the untouched /scan topic.
    near_field_passthrough_range: 0.0
    tf_timeout: 0.03
sipp_decision_node:
  ros__parameters:
    use_sim_time: true
    shadow_mode: false
    decision_frequency: 10.0
    conflict_radius: 0.78
    # Centre-distance geometry: robot radius 0.22 m plus the 0.60 m square
    # obstacle's 0.424 m circumscribed radius is about 0.644 m.
    hard_release_radius: 0.65
    conflict_longitudinal_margin: 0.30
    time_margin: 0.35
    # Entry remains conservative, but release uses the shorter hard-zone
    # window so a stopped robot can start before the obstacle clears the whole
    # soft corridor.
    release_time_margin: 0.15
    half_vehicle_length: 0.20
    static_stop_margin: 0.70
    comfortable_deceleration: 2.50
    launch_acceleration: 2.00
    stop_reached_tolerance: 0.05
    minimum_prediction_speed: 0.30
    maximum_prediction_speed: 1.40
    endpoint_distance: 0.40
    data_timeout: 0.6
    global_frame: map
    robot_base_frame: base_footprint
    # A path is state, not a heartbeat. The stable Nav2 behavior tree publishes
    # it once per navigation leg; zero keeps it valid until the next path.
    plan_timeout: 0.0
    tf_timeout: 0.05
    maximum_path_deviation: 0.75
    maximum_index_backtrack: 2
    maximum_occupancy_gap: 0.25
    same_goal_tolerance: 0.25
    route_change_threshold: 0.50
    route_change_confirm_cycles: 3
    conflict_confirm_cycles: 3
    conflict_release_time: 0.50
    conflict_match_radius: 0.45
    conflict_clear_margin: 0.35
    prepare_lead_time: 0.70
    departure_heading_lookahead: 0.40
    departure_yaw_tolerance: 0.08
    prepare_yaw_kp: 1.00
    prepare_max_angular_speed: 1.30
    prepare_min_angular_speed: 0.25
    prepare_settle_time: 0.20
    release_confirm_time: 0.45
    fast_cruise_speed: 1.40
    normal_cruise_speed: 1.25
    cautious_speed: 0.65
    fast_cruise_horizon: 3.0
    fast_cruise_min_goal_distance: 0.60
    fast_cruise_max_heading_error: 0.25
    fast_cruise_max_curvature: 0.60
    mppi_feedback_timeout: 0.40
    mppi_pass_min_safe_ratio: 0.80
    # The active local controller is RPP, which publishes no MPPI critic
    # feedback. SIPP still requires a stable safe window, aligned departure,
    # and a fresh forward RPP command before release; Collision Monitor keeps
    # independent hard-stop authority on the unfiltered scan.
    require_mppi_feedback_for_release: false
    pass_commit_timeout_margin: 2.00
    pass_entry_hysteresis: 0.05
    # PREPARE holds the executed command at zero. MPPI's safe preview commonly
    # starts at 0.15-0.25 m/s, then accelerates after release; 0.35 caused a
    # circular wait until Nav2 recovery. Keep a non-zero intent requirement.
    pass_release_min_nav_speed: 0.25
    pass_release_max_nav_angular_speed: 0.35
    # RPP legitimately follows the post-crossing curve at up to 1.087 rad/s.
    # SIPP has already aligned the chassis to the crossing exit tangent before
    # this check, so permit that bounded moving turn only in RPP mode.
    rpp_pass_release_max_nav_angular_speed: 1.10
    pass_emergency_ttc: 0.60
    # Debounce ordinary timing/feasibility noise after a valid PASS. A hard
    # MPPI emergency recommendation still overrides immediately.
    pass_recheck_confirm_cycles: 2
    pass_stall_timeout: 0.45
    pass_stall_speed: 0.05
    pass_stall_angular_speed: 0.15
    blocked_redecision_hold: 0.80
    # Prefer an MPPI-feasible local bypass when its estimated cost is lower
    # than waiting.  Hard TTC/override feedback still vetoes this commitment.
    # Local detour scoring depends on /mppi/sipp_feedback and is unavailable
    # while the deterministic RPP controller is active.
    enable_local_detour: false
    detour_min_wait_time: 0.45
    detour_base_extra_time: 0.30
    detour_risk_time_weight: 0.60
    detour_safe_trajectory_ratio: 0.88
    detour_min_collision_ttc: 0.90
    detour_speed: 1.15
    # A detour needs time to form a lateral trajectory. Do not revoke it on
    # one noisy MPPI frame or before the initial steering action can progress.
    detour_min_commit_time: 1.20
    detour_recheck_confirm_cycles: 3
    departure_turn_heading_error: 0.55
    departure_turn_path_distance: 0.30
sipp_velocity_gate:
  ros__parameters:
    use_sim_time: true
    decision_timeout: 0.5
    comfortable_deceleration: 2.50
    approach_angular_zero_distance: 0.30
    prepare_max_angular_speed: 1.30
    # Context-aware straight-line cruise guard. It may boost or filter only
    # while SIPP reports a conflict-free CRUISE state and the raw scan, path
    # geometry and tracking error all independently confirm a clear straight.
    cruise_guard_enabled: true
    cruise_scan_timeout: 0.30
    cruise_front_half_angle_deg: 25.0
    cruise_side_outer_angle_deg: 70.0
    # Entry is fitted to the 2026-09-04 telemetry. Exit remains looser and
    # obstacle/SIPP violations still bypass the debounce immediately.
    cruise_front_clearance_enter: 1.35
    cruise_front_clearance_exit: 1.15
    cruise_side_clearance_enter: 0.65
    cruise_side_clearance_exit: 0.52
    cruise_path_deviation_enter: 0.18
    cruise_path_deviation_exit: 0.30
    cruise_heading_error_enter: 0.28
    cruise_heading_error_exit: 0.48
    cruise_curvature_enter: 0.45
    cruise_curvature_exit: 0.75
    cruise_min_remaining_path: 0.80
    cruise_entry_confirm_ticks: 3
    cruise_exit_confirm_ticks: 3
    cruise_entry_max_angular_speed: 0.35
    cruise_exit_max_angular_speed: 0.60
    cruise_angular_deadband: 0.15
    cruise_reversal_confirm_ticks: 5
    cruise_angular_filter_alpha: 0.50
    cruise_min_speed: 1.05
    # Speed boost is intentionally stricter than angular stabilization.
    cruise_boost_max_angular_speed: 0.24
    cruise_boost_max_heading_error: 0.30
    cruise_boost_max_curvature: 0.45
    cruise_boost_front_clearance: 1.50
    cruise_boost_side_clearance: 0.75
